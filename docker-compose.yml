services:
  db:
    image: postgres:15
    container_name: resume-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: resume-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: resume_db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: resume-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend